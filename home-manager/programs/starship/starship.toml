add_newline = true

format = """
 $username$hostname$directory\
 $git_branch$git_commit $git_status\
 $cmd_duration\
 $fill\
 $gleam\
 $haskell\
 $nodejs\
 $ruby\
 $rust\
 $time
 $character"""

command_timeout = 500

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
bg0H    = "#1d2021"
bg0     = "#282828"
bg1     = "#3c3836"
bg2     = "#504945"
bg3     = "#665c54"
bg4     = "#7c6f64"
fg0     = "#fbf1c7"
fg1     = "#ebdbb2"
fg2     = "#d5c4a1"
fg3     = "#bdae93"
fg4     = "#a89984"
gray    = "#928374"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
purple  = "#b16286"
aqua    = "#689d6a"
orange  = "#d65d0e"
bright-red    = "#fb4934"
bright-green  = "#b8bb26"
bright-yellow = "#fabd2f"
bright-blue   = "#83a598"
bright-purple = "#d3869b"
bright-aqua   = "#8ec07c"
bright-orange = "#fe8019"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold bright-blue)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold aqua)"

[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
style = "bright-blue"

[git_branch]
format = "[$symbol$branch]($style)"
style = "bg3"

[git_commit]
commit_hash_length = 7
format = "[\\[$hash\\]]($style)"
only_detached = false
style = "purple"

[git_status]
format = "([\\[ ($conflicted$deleted$renamed$modified$typechanged$staged$ahead_behind)\\]]($style) )"
style = "yellow"
conflicted = "🏳${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
modified = "∆${count} "
staged = "󰃸${count} "
renamed = "⇒${count} "
deleted = "󰆴${count} "

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 2000

[username]
format = "[$user]($style)@"
style_user = "bold green"
show_always = false

[hostname]
format = "[$hostname]($style) "
style = "bold green"
ssh_only = true

[gleam]
format = "[\\[$symbol$version\\]]($style) "
style = "bright-purple"
symbol = "󰓎 "

[haskell]
format = "[\\[$symbol$version\\]]($style) "
style = "purple"

[nodejs]
format = "[\\[$symbol$version\\]]($style) "
style = "green"

[ruby]
symbol = " "
format = "[\\[$symbol$version\\]]($style) "
style = "red"

[rust]
format = "[\\[$symbol$version\\]]($style) "
style = "orange"

[time]
disabled = false
format = "[\\[$time\\]]($style) "
style = "white"
time_format = "%H:%M"
