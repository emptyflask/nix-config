# Key and cert generated via:
#openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout ./nginx/ssl/nginx-selfsigned.key -out /nginx/ssl/nginx-selfsigned.crt

ssl_certificate     /etc/nginx/conf.d/ssl/nginx-selfsigned.crt;
ssl_certificate_key /etc/nginx/conf.d/ssl/nginx-selfsigned.key;
ssl_dhparam         /etc/nginx/conf.d/ssl/dhparam.pem;

ssl_session_cache shared:SSL:20m;
ssl_session_timeout 20m;

add_header Strict-Transport-Security "max-age=31536000" always;
